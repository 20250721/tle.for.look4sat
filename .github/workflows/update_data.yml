name: Auto Update Orbital Data

on:
  schedule:
    - cron: '0 */3 * * *' # 每3小时执行
  workflow_dispatch: # 手动触发

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Download Script
        run: |
          # 格式化生成 README.md，增加了一些简单的描述信息
          echo "# Auto Update Status" > README.md
          echo "" >> README.md
          echo "This repository automatically checks and updates orbital and transmitter data from various sources every 3 hours for look4sat" >> README.md
          echo "" >> README.md
          echo "**Last Execution:** $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S CST')" >> README.md
          echo "" >> README.md
          echo '```text' >> README.md
          
          # 执行脚本，合并标准输出和错误输出，显示在控制台的同时追加写入 README.md
          python download.py 2>&1 | tee -a README.md
          
          echo '```' >> README.md

      - name: Purge data history (keep .git small)
        run: |
          # 使用 git-filter-repo 删除所有历史提交中的 data/ 目录，
          # 只保留当前最新数据快照，避免 .git 无限膨胀。
          # --force 绕过"非全新 clone"检查；filter-repo 会移除 origin，
          # 需要重新添加。
          pip install --quiet git-filter-repo
          git filter-repo --path data/ --invert-paths --force
          git remote add origin https://github.com/${{ github.repository }}.git

      - name: Push to Branch
        run: |
          UPDATE_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S CST')
          > commit_msg.txt

          # Purge 步骤会移除 data/ 的历史，工作区中的数据文件变为未跟踪，
          # 因此 data/ 每次都会被重新提交（.git 中始终只保留最新快照）。
          echo "Auto orbital data update | $UPDATE_TIME" >> commit_msg.txt
          echo "" >> commit_msg.txt
          echo "Modified files & size:" >> commit_msg.txt

          git status --porcelain data/ | awk '{print $NF}' | sed 's/"//g' | while read -r file; do
            if [ -f "$file" ]; then
              FSIZE=$(du -sh "$file" | awk '{print $1}')
              echo " - $file | $FSIZE" >> commit_msg.txt
            fi
          done

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 历史已被改写，必须强制推送覆盖远端
          git add data/ README.md
          git commit -F commit_msg.txt
          git push --force origin HEAD
          rm -f commit_msg.txt
